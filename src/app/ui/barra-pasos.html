<nav aria-label="Pasos del análisis">
  <ol class="flex gap-1 overflow-x-auto sm:gap-2">
    @for (p of pasos(); track p.numero) {
      <li class="min-w-36 flex-1">
        <button
          type="button"
          class="flex h-full w-full items-center gap-3 rounded-lg border-b-4 px-3 py-2 text-left transition-colors disabled:cursor-not-allowed"
          [class]="
            p.numero === actual()
              ? 'border-blue-700 bg-blue-50'
              : p.bloqueado
                ? 'border-transparent opacity-60'
                : 'border-transparent hover:bg-slate-100'
          "
          [disabled]="p.bloqueado"
          [attr.aria-current]="p.numero === actual() ? 'step' : null"
          [attr.title]="p.bloqueado ? 'Completa antes los pasos anteriores' : null"
          (click)="ir.emit(p.numero)"
        >
          <!-- Círculo con el número, o una marca si el paso ya está hecho -->
          <span
            class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-semibold"
            [class]="
              p.numero === actual()
                ? 'bg-blue-700 text-white'
                : p.hecho
                  ? 'bg-emerald-700 text-white'
                  : 'bg-slate-200 text-slate-700'
            "
            aria-hidden="true"
          >
            {{ p.hecho && p.numero !== actual() ? '✓' : p.numero }}
          </span>
          <span class="min-w-0">
            <span class="block text-sm font-semibold text-slate-900">
              <span class="sr-only">Paso {{ p.numero }}: </span>{{ p.titulo }}
              @if (p.hecho) {
                <span class="sr-only"> (hecho)</span>
              }
            </span>
            <span class="block truncate text-xs text-slate-600">{{ p.resumen }}</span>
          </span>
        </button>
      </li>
    }
  </ol>
</nav>
